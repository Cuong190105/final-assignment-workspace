<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>LearnHub — Login</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        />
        <link rel="stylesheet" href="Style.css" />
    </head>
    <body>
        <nav class="navbar navbar-expand-lg sticky-top">
            <div class="container d-flex justify-content-center">
                <a class="navbar-brand fs-4" href="index.html">
                    <i class="bi bi-mortarboard-fill"></i> LearnHub
                </a>
            </div>
        </nav>

        <main class="auth-shell">
            <div class="container">
                <div class="row justify-content-center align-items-center g-4">
                    <div class="col-lg-6">
                        <div
                            class="card auth-panel auth-form-card shadow-custom rounded-custom p-4 p-md-5"
                        >
                            <div
                                id="authMessage"
                                class="alert auth-message"
                                role="alert"
                            ></div>

                            <h2 class="h3 fw-bold mb-2">Login</h2>

                            <form
                                data-auth-form
                                data-auth-mode="login"
                                novalidate
                            >
                                <div class="form-floating mb-3">
                                    <input
                                        type="text"
                                        class="form-control"
                                        id="username"
                                        placeholder="Username"
                                        required
                                    />
                                    <label for="username">Username</label>
                                </div>

                                <div class="mb-3 position-relative">
                                    <div class="form-floating">
                                        <input
                                            type="password"
                                            class="form-control pe-5"
                                            id="loginPassword"
                                            placeholder="Password"
                                            required
                                            minlength="6"
                                        />
                                        <label for="loginPassword"
                                            >Password</label
                                        >
                                    </div>
                                    <button
                                        type="button"
                                        class="password-toggle"
                                        data-password-toggle
                                        data-target="loginPassword"
                                        aria-label="Show password"
                                    >
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>

                                <button
                                    type="submit"
                                    class="btn-custom btn-primary-custom w-100"
                                >
                                    Login
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer id="contact">
            <div class="container">
                <div class="row g-4">
                    <div class="col-lg-4 col-md-6">
                        <div class="footer-title fs-5">
                            <i class="bi bi-mortarboard-fill"></i> LearnHub
                        </div>
                        <p class="text-white-50">
                            LearnHub helps you learn practical, job-ready skills
                            with expert-led, self-paced courses in web
                            development, design, data science, and marketing.
                        </p>
                    </div>
                    <div class="col-lg-4 col-md-6">
                        <div class="footer-title fs-5">Quick Links</div>
                        <a
                            href="index.html"
                            class="footer-link auth-footer-link"
                            >Courses</a
                        >
                        <a href="#contact" class="footer-link auth-footer-link"
                            >Contact</a
                        >
                    </div>
                    <div class="col-lg-4 col-md-6">
                        <div class="footer-title fs-5">Contact</div>
                        <a
                            href="mailto:support@learnhub.com"
                            class="footer-link auth-footer-link"
                        >
                            <i class="bi bi-envelope-fill"></i>
                            support@learnhub.com
                        </a>
                        <a
                            href="tel:+84123456789"
                            class="footer-link auth-footer-link"
                        >
                            <i class="bi bi-telephone-fill"></i> +84 123 456 789
                        </a>
                        <a href="#" class="footer-link auth-footer-link">
                            <i class="bi bi-geo-alt-fill"></i> Hanoi, Vietnam
                        </a>
                    </div>
                </div>
                <div class="footer-bottom">
                    &copy; 2026 LearnHub. All rights reserved.
                </div>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="app.js"></script>
    </body>
</html>
