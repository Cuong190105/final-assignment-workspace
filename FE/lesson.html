<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Lesson | LearnHub</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="Style.css" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        />
    </head>

    <body>
        <nav class="navbar navbar-expand-lg sticky-top">
            <div class="container">
                <a class="navbar-brand fs-4" href="index.html">
                    <i class="bi bi-mortarboard-fill"></i> LearnHub
                </a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#lessonNavMenu"
                    aria-controls="lessonNavMenu"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div
                    class="collapse navbar-collapse align-items-lg-center gap-lg-3"
                    id="lessonNavMenu"
                >
                    <div
                        class="lesson-navbar-progress flex-grow-1 mx-lg-4 my-3 my-lg-0"
                    >
                        <div
                            class="d-flex justify-content-between align-items-center mb-1 gap-2 flex-wrap"
                        >
                            <span class="small fw-semibold text-muted"
                                >Lesson progress</span
                            >
                            <span id="progressText" class="small text-muted"
                                >0 / 0 lessons completed</span
                            >
                        </div>

                        <div class="progress progress-thin">
                            <div
                                id="progressBar"
                                class="progress-bar progress-fill bg-success"
                                role="progressbar"
                                aria-valuemin="0"
                                aria-valuemax="100"
                                aria-valuenow="0"
                            ></div>
                        </div>
                    </div>

                    <div class="d-flex align-items-center gap-3 ms-lg-auto">
                        <div class="auth-nav-slot" data-auth-nav>
                            <a
                                class="btn-custom btn-primary-custom"
                                href="login.html"
                                >Login</a
                            >
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <main class="lesson-page">
            <aside
                class="course-sidebar lesson-sidebar shadow-custom"
                id="lessonSidebar"
            >
                <div class="lesson-sidebar-header">
                    <button
                        type="button"
                        class="btn-custom btn-outline-secondary lesson-sidebar-close d-lg-none"
                        id="lessonSidebarCloseBtn"
                    >
                        <i class="bi bi-x-lg"></i>
                        Close
                    </button>

                    <a
                        id="backToCourseBtn"
                        class="btn-custom btn-outline-secondary w-100 mb-3 d-inline-flex align-items-center justify-content-center gap-2"
                        href="#"
                    >
                        <i class="bi bi-arrow-left"></i>
                        Back to Course Detail
                    </a>

                    <p class="text-uppercase text-muted small fw-semibold mb-1">
                        Course
                    </p>
                    <h3 id="courseTitle" class="mb-0"></h3>
                </div>

                <div class="accordion" id="accordionCurriculum"></div>
            </aside>

            <div class="lesson-page-content">
                <div class="lesson-mobile-toolbar d-lg-none">
                    <a
                        id="mobileBackToCourseBtn"
                        class="btn-custom btn-outline-secondary d-inline-flex align-items-center justify-content-center gap-2"
                        href="#"
                    >
                        <i class="bi bi-arrow-left"></i>
                        Back
                    </a>

                    <button
                        type="button"
                        class="btn-custom btn-primary-custom d-inline-flex align-items-center justify-content-center gap-2"
                        id="lessonSidebarOpenBtn"
                    >
                        <i class="bi bi-layout-sidebar-inset"></i>
                        Extend
                    </button>
                </div>

                <h4 id="lessonTitle" class="mt-3"></h4>

                <div class="video-container" id="lessonVideoContainer">
                    <video id="lessonVideo" controls>
                        Trình duyệt của bạn không hỗ trợ video.
                    </video>
                </div>

                <div
                    class="lesson-quiz-container d-none mt-3"
                    id="lessonQuizContainer"
                ></div>

                <div
                    class="lesson-video-nav mt-3 d-flex flex-wrap gap-2 justify-content-between"
                >
                    <button
                        type="button"
                        class="btn-custom btn-outline-secondary d-inline-flex align-items-center justify-content-center gap-2"
                        id="prevLessonBtn"
                    >
                        <i class="bi bi-arrow-left"></i>
                        Previous lesson
                    </button>

                    <button
                        type="button"
                        class="btn-custom btn-primary-custom d-inline-flex align-items-center justify-content-center gap-2"
                        id="nextLessonBtn"
                    >
                        Next lesson
                        <i class="bi bi-arrow-right"></i>
                    </button>
                </div>
            </div>
            <div
                class="lesson-sidebar-backdrop d-lg-none"
                id="lessonSidebarBackdrop"
            ></div>
        </main>

        <script src="app.js"></script>
        <script src="lesson.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
