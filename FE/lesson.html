<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Lesson</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg admin-topbar sticky-top">
        <div class="container-fluid px-3 px-lg-4 d-flex align-items-center position-relative">

            <!-- Logo -->
            <a class="navbar-brand fs-4 mb-0" href="index.html">
                <i class="bi bi-mortarboard-fill"></i> LearnHub
            </a>

            <!-- Tên khóa học -->
            <div class="position-absolute start-50 translate-middle-x">
                <h3 id="courseTitle" class="admin-topbar-title mb-0"></h3>
            </div>

        </div>
    </nav>

    <div class="container mt-4">
        <h4 id="lessonTitle" class="mt-3"></h4>

        <div class="video-container">
            <video id="lessonVideo" controls>
                Trình duyệt của bạn không hỗ trợ video.
            </video>
        </div>

        <div class="progress">
            <div id="progressBar" class="progress-bar bg-success progress-empty"></div>
        </div>

        <p id="progressText"> 0/0 lessons completed </p>

        <div class="accordion" id="accordionCurriculum"></div>
    </div>

    <script src="data.js"></script>
    <script src="lesson.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
